version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing Terraform via apt..."
      - wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
      - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
      - apt-get update && apt-get install -y terraform
      - terraform --version
  pre_build:
    commands:
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Entering AWS Terraform directory..."
      - cd terraform/aws
      - echo "Initializing Terraform..."
      - echo "Clearing potential zombie lock (manual)..."
      - terraform init
      - echo "Skipping Terraform Plan for Destroy..."
      - cd ../..
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 177633253446.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=177633253446.dkr.ecr.us-east-1.amazonaws.com/spring-boot-hello
      - WORKER_REPOSITORY_URI=177633253446.dkr.ecr.us-east-1.amazonaws.com/spring-boot-worker
  build:
    commands:
      - echo "Skipping build for destroy..."
  post_build:
    commands:
      - echo Build completed on `date`
      - echo "Emptying ECR repositories..."
      - aws ecr list-images --repository-name spring-boot-hello --region us-east-1 --query 'imageIds[*]' --output json > hello_images.json || echo "[]" > hello_images.json
      - aws ecr batch-delete-image --repository-name spring-boot-hello --region us-east-1 --image-ids file://hello_images.json || true
      - aws ecr list-images --repository-name spring-boot-worker --region us-east-1 --query 'imageIds[*]' --output json > worker_images.json || echo "[]" > worker_images.json
      - aws ecr batch-delete-image --repository-name spring-boot-worker --region us-east-1 --image-ids file://worker_images.json || true
      - echo "Cleaning up dangling ALBs and Target Groups..."
      - ALB_ARNS=$(aws elbv2 describe-load-balancers --region us-east-1 --query 'LoadBalancers[*].LoadBalancerArn' --output text || echo "")
      - for ARN in $ALB_ARNS; do aws elbv2 delete-load-balancer --region us-east-1 --load-balancer-arn "$ARN" || true; done
      - sleep 30
      - TARGET_GROUP_ARNS=$(aws elbv2 describe-target-groups --region us-east-1 --query 'TargetGroups[*].TargetGroupArn' --output text || echo "")
      - for ARN in $TARGET_GROUP_ARNS; do aws elbv2 delete-target-group --region us-east-1 --target-group-arn "$ARN" || true; done
      - echo "Scaling down and deleting ECS services in spring-boot-dr-cluster..."
      - CLUSTER_NAME="spring-boot-dr-cluster"
      - SERVICES=$(aws ecs list-services --cluster $CLUSTER_NAME --region us-east-1 --query 'serviceArns[*]' --output text || echo "")
      - for SERVICE in $SERVICES; do aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE --desired-count 0 --region us-east-1 || true; done
      - sleep 30
      - for SERVICE in $SERVICES; do aws ecs delete-service --cluster $CLUSTER_NAME --service $SERVICE --force --region us-east-1 || true; done
      - echo "Destroying Terraform (AWS)..."
      - cd terraform/aws
      - export TF_VAR_commit_sha=$IMAGE_TAG
      - terraform destroy -auto-approve -lock=false
      - cd ../..
      - echo Writing image definitions file...
